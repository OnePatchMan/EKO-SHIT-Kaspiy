spring.application.name=ecoshield-caspian-backend
server.port=8080

# DataSource & JPA H2 Configuration
spring.datasource.url=jdbc:h2:mem:ecoshield_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Application specific properties
ecoshield.ai.service-url=http://localhost:8000
ecoshield.upload-dir=uploads
ecoshield.mock-ai-fallback=true
